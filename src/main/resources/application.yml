spring:
  application:
    name: ordenes-service
  cloud:
    aws:
      region:
        static: ${CLOUDWATCH_REGION:us-east-1}
      credentials:
        access-key: ${CLOUDWATCH_ACCESS_KEY:test}
        secret-key: ${CLOUDWATCH_SECRET_KEY:test}
      endpoint: ${CLOUDWATCH_ENDPOINT:http://localhost:4566}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/db_ordenes}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8082

app:
  topic:
    inventory-update: ${INVENTORY_UPDATE_TOPIC:inventory_update_events}
    order-status-changed: ${ORDER_STATUS_CHANGED_TOPIC:order_status_changed_events}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

observability:
  cloudwatch:
    logs:
      endpoint: ${CLOUDWATCH_ENDPOINT:http://localhost:4566}
      region: ${CLOUDWATCH_REGION:us-east-1}
      access-key: ${CLOUDWATCH_ACCESS_KEY:test}
      secret-key: ${CLOUDWATCH_SECRET_KEY:test}
      log-group: ${CLOUDWATCH_LOG_GROUP:ordenes-log-group}
      log-stream-prefix: ${CLOUDWATCH_LOG_STREAM_PREFIX:ordenes-service}

logging:
  level:
    root: INFO
    com.ordenesservice.ordenesservice: DEBUG
    org.springframework.kafka: DEBUG
    org.apache.kafka: DEBUG
