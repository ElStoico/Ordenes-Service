spring:
  application:
    name: ordenes-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/db_ordenes}

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
